openapi: 3.0.0
info:
  title: AdminAddmyco API
  version: 1.0.0
  description: API documentation for AdminAddmyco project
servers:
  - url: http://localhost:3000
paths:
  /register:
    post:
      summary: Register a new user
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: User registered successfully
  /login:
    post:
      summary: Login a user
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: User logged in successfully
  /telegram-login:
    post:
      summary: Login via Telegram mini app
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telegram_username:
                  type: string
                country:
                  type: string
      responses:
        "200":
          description: Login successful, premium membership granted for new users
  /getcontact:
    get:
      summary: Get user contacts
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of contacts
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
